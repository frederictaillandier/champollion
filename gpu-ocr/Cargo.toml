[package]
name = "gpu-ocr"
version = "0.1.0"
edition = "2024"

[dependencies]
fast_image_resize = { version = "6.1.0", features = ["image"] }
game-text = { path = "../game-text" }
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
serde_json = "1.0.151"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[build-dependencies]
cc = "1.2.65"

[[bin]]
name = "champollion-gpu-ocr"
path = "src/main.rs"
