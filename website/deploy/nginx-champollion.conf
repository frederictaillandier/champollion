# Champollion's website, for WireGuard peers only: http://10.0.0.1/champollion/
# Plain HTTP: WireGuard already encrypts the traffic. Requests from any other
# address get 403, even with a forged Host header, since the check is on the
# client's address.
server {
    listen 80;
    server_name 10.0.0.1;

    allow 10.0.0.0/24;
    deny all;

    location = /champollion {
        return 301 /champollion/;
    }
    location /champollion/ {
        root /var/www;
        try_files $uri $uri/ =404;
    }
    location / {
        return 404;
    }
}
