[package]
name = "game-text"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }
unicode-normalization = "0.1.25"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[[bin]]
name = "champollion-game-text"
path = "src/main.rs"
